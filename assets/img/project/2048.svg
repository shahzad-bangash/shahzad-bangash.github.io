<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Subtle Board Outline -->
  <rect x="250" y="75" width="300" height="300" rx="14" fill="#21262d" stroke="#30363d" stroke-width="2"/>

  <!-- 4x4 Tiles Mini Preview -->
  <!-- Row 0 -->
  <rect x="264" y="89" width="58" height="58" rx="8" fill="#1f293d"/>
  <text x="293" y="126" font-family="monospace" font-size="22" font-weight="bold" fill="#93c5fd" text-anchor="middle">2</text>

  <rect x="334" y="89" width="58" height="58" rx="8" fill="#1e3a5f"/>
  <text x="363" y="126" font-family="monospace" font-size="22" font-weight="bold" fill="#60a5fa" text-anchor="middle">4</text>

  <rect x="404" y="89" width="58" height="58" rx="8" fill="#1e40af"/>
  <text x="433" y="126" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>

  <rect x="474" y="89" width="58" height="58" rx="8" fill="#0d9488"/>
  <text x="503" y="126" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">16</text>

  <!-- Row 1 -->
  <rect x="264" y="159" width="58" height="58" rx="8" fill="#059669"/>
  <text x="293" y="196" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">32</text>

  <rect x="334" y="159" width="58" height="58" rx="8" fill="#16a34a"/>
  <text x="363" y="196" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">64</text>

  <rect x="404" y="159" width="58" height="58" rx="8" fill="#d97706"/>
  <text x="433" y="196" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">128</text>

  <rect x="474" y="159" width="58" height="58" rx="8" fill="#ea580c"/>
  <text x="503" y="196" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">256</text>

  <!-- Row 2 -->
  <rect x="264" y="229" width="58" height="58" rx="8" fill="#dc2626"/>
  <text x="293" y="266" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">512</text>

  <rect x="334" y="229" width="58" height="58" rx="8" fill="#9333ea"/>
  <text x="363" y="266" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1024</text>

  <!-- The Crown Jewel: 2048 Tile with Glow -->
  <rect x="404" y="229" width="128" height="128" rx="10" fill="#eab308" filter="url(#tileGlow)"/>
  <text x="468" y="306" font-family="sans-serif" font-size="34" font-weight="800" fill="#000000" text-anchor="middle">2048</text>

  <!-- Row 3 remaining -->
  <rect x="264" y="299" width="58" height="58" rx="8" fill="#1f293d"/>
  <text x="293" y="336" font-family="monospace" font-size="22" font-weight="bold" fill="#93c5fd" text-anchor="middle">2</text>

  <rect x="334" y="299" width="58" height="58" rx="8" fill="#1e3a5f"/>
  <text x="363" y="336" font-family="monospace" font-size="22" font-weight="bold" fill="#60a5fa" text-anchor="middle">4</text>

  <!-- Top Title Overlay -->
  <text x="400" y="48" font-family="sans-serif" font-size="24" font-weight="800" fill="#f0f6fc" text-anchor="middle" letter-spacing="1">2048 PUZZLE GAME</text>
  <text x="400" y="415" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">SLIDE &bull; MERGE &bull; REACH 2048</text>
</svg>
